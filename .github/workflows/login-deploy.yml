name: CI/CD Tela de Login Profissional

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validacao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar arquivos essenciais
        run: |
          test -f index.html || (echo "ERRO: index.html não encontrado" && exit 1)
          test -f auth.js || (echo "ERRO: auth.js não encontrado" && exit 1)
          test -f package.json || (echo "ERRO: package.json não encontrado" && exit 1)
          echo "Todos os arquivos base estão presentes!"

  testes:
    needs: validacao
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências (Forçado)
        run: npm ci || npm install

      - name: Executar 5 Casos de Teste (Caminho Direto)
        run: ./node_modules/.bin/jest --passWithNoTests

  deploy:
    needs: testes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload dos arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
