<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TelaLogin</title>
    <link rel="stylesheet" href="Login.css" />
  </head>
  <body>
    <section id="Login">
      <form autocomplete="off">
        <h1>Login</h1>

        <div class="inputBox">
          <label for="iemail"></label>
          <input
            type="email"
            id="iemail"
            name="email"
            required
            minlenght="5"
            maxlength="30"
            placeholder="E-mail:"
          />
        </div>

        <div class="inputBox">
          <label for="ipassword"></label>
          <input
            type="password"
            id="ipassword"
            name="password"
            placeholder="Senha:"
            required
            minlenght="5"
            maxlength="30"
          />
        </div>

        <div class="forget">
          <input type="checkbox" name="remember" id="iremember" />
          <label for="iremember">Me manter conectado</label>

          <a href="#">Esqueci minha senha </a>
        </div>
      </form>
       <button onclick="validarsenha()">Log in</button>
    </section>

    <script src="auth.js">
      
    </script>
  </body>
</html>
